<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Kinderpunkte
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <!-- LOGOUT -->

  <button
    id="logoutButton"
    class="logout-floating minus"
  >
    Logout
  </button>

  <!-- LOGIN -->

  <div id="loginMount"></div>

  <!-- MAIN -->

  <main>

    <!-- KIDS -->

    <section>

      <div id="kidsContainer">

        <div class="loading">
          Lade Kinder...
        </div>

      </div>

    </section>

    <!-- REWARDS -->

    <section>

      <h2>
        Belohnungen
      </h2>

      <div id="rewardsContainer">

        <div class="loading">
          Lade Belohnungen...
        </div>

      </div>

    </section>

    <!-- ADMIN -->

    <section id="adminMount"></section>

  </main>

  <!-- REWARD OVERLAY -->

  <div
    id="rewardOverlay"
    class="reward-overlay"
  >

    <div class="card">

      <h2>
        🎉 Belohnung
      </h2>

      <div
        id="rewardOverlayText"
        class="name"
      >
        +0 Punkte
      </div>

    </div>

  </div>

  <!-- SCRIPTS -->

  <script
    type="module"
    src="js/app.js"
  ></script>

</body>

</html>
