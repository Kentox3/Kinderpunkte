<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinder Punkte System</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  padding:22px;

  background:
    radial-gradient(circle at top left,rgba(255,255,255,.16),transparent 35%),
    linear-gradient(135deg,#10172f,#263b7a,#6d46c9);
}

.container,
.reward-box,
.admin-box{
  max-width:950px;
  margin:auto;
  display:grid;
  gap:22px;
}

.card,
.reward-card,
.admin-panel{
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  border-radius:26px;
  padding:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 14px 40px rgba(0,0,0,.28);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.name{
  font-size:2rem;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:10px;
}

.points{
  font-size:1.4rem;
  font-weight:bold;
}

.bar-bg{
  width:100%;
  height:34px;
  background:rgba(0,0,0,.28);
  border-radius:999px;
  overflow:hidden;
  padding:4px;
}

.bar{
  height:100%;
  min-width:42px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.luna .bar{
  background:linear-gradient(90deg,#ff7eb3,#ff4d97,#ffd1ec);
}

.milo .bar{
  background:linear-gradient(90deg,#5ee7ff,#1e90ff,#a9f2ff);
}

.finn .bar{
  background:linear-gradient(90deg,#8dff8d,#27c93f,#d6ffd6);
}

.reward-card .bar{
  background:linear-gradient(90deg,#ffd86b,#ff9f43,#ffeaa7);
}

.reward-card{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:18px;
}

.reward-img{
  width:180px;
  height:140px;
  object-fit:cover;
  border-radius:18px;
}

.reward-title{
  font-size:1.5rem;
  font-weight:bold;
  margin-bottom:10px;
}

.reward-small{
  opacity:.9;
  margin-top:8px;
}

.reward-controls{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.reward-controls input{
  width:100%;
}

button,
input,
select{
  border:none;
  border-radius:14px;
  padding:12px;
  font-size:1rem;
}

button{
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.plus{
  background:#2ecc71;
}

.minus{
  background:#e74c3c;
}

.save{
  background:#9b59b6;
}

.open{
  background:#3498db;
}

.logout-button{
  display:block;
  margin:45px auto 10px;
  background:rgba(255,255,255,.15);
}

.chest-button{
  background:rgba(255,255,255,.16);
}

.reward-section-title{
  max-width:950px;
  margin:34px auto 12px;
  font-size:1.8rem;
  font-weight:bold;
}

.reward-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  flex-direction:column;
}

.big-star{
  font-size:7rem;
}

.reward-text{
  font-size:2rem;
  margin-top:18px;
}

.loading,
.error,
.success{
  text-align:center;
  border-radius:18px;
  padding:16px;
}

.loading{
  background:rgba(255,255,255,.12);
}

.error{
  background:rgba(231,76,60,.25);
}

.success{
  background:rgba(46,204,113,.25);
}

.admin-panel{
  display:none;
}

.admin-grid{
  display:grid;
  gap:12px;
}

@media(max-width:700px){

  .reward-card{
    grid-template-columns:1fr;
  }

  .reward-img{
    width:100%;
    height:220px;
  }

}

</style>
</head>

<body>

<div id="loginOverlay" class="reward-overlay" style="display:flex">

  <div class="admin-panel" style="display:block;max-width:360px;width:90%">

    <h2>⭐ Login</h2>

    <div class="admin-grid">

      <input
        id="pinInput"
        type="password"
        placeholder="PIN oder leer für Gast"
      >

      <button class="open" onclick="unlock()">
        Einloggen
      </button>

      <button class="save" onclick="guestLogin()">
        Gastmodus
      </button>

    </div>

  </div>

</div>

<div id="lootOverlay" class="reward-overlay">
  <div class="big-star">⭐</div>
  <div id="lootText" class="reward-text"></div>
</div>

<div class="container" id="kidsContainer"></div>

<div class="reward-section-title">
  🎁 Belohnungen
</div>

<div class="reward-box" id="rewardsContainer"></div>

<div class="admin-box">

  <div class="admin-panel" id="adminPanel">

    <h2>Loot vergeben</h2>

    <div class="admin-grid">

      <select id="lootChild">
        <option>Luna</option>
        <option>Milo</option>
        <option>Finn</option>
      </select>

      <input
        id="lootAmount"
        type="number"
        value="5"
        min="1"
      >

      <button class="plus" onclick="giveLoot()">
        Loot vergeben
      </button>

    </div>

  </div>

</div>

<button class="logout-button" onclick="logout()">
  Logout
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzJnFU-3C8U0EpnnbvohU57t1cWQebdQVQCx76yBq_3bOtS_5POeba4uZkTaMcp93h7/exec";

const API_KEY = "272520";

const parentPin = "272520";

const kidsConfig = {

  Luna:{
    row:2,
    pin:"271",
    className:"luna",
    contributionCol:"I"
  },

  Milo:{
    row:3,
    pin:"254",
    className:"milo",
    contributionCol:"J"
  },

  Finn:{
    row:4,
    pin:"207",
    className:"finn",
    contributionCol:"K"
  }

};

const firstLootColumn = 4;
const lootSlots = 20;

const rewardsStartRow = 11;
const rewardsEndRow = 40;

let unlockedChild = null;
let rewardsData = [];
let kidsData = [];
let loadingReward = false;
let rewardCooldown = false;
let slideTick = 0;

const kidsContainer =
document.getElementById("kidsContainer");

const rewardsContainer =
document.getElementById("rewardsContainer");

const adminPanel =
document.getElementById("adminPanel");

const savedLogin =
localStorage.getItem("unlockedChild");

if(savedLogin){

  unlockedChild = savedLogin;

  document.getElementById(
    "loginOverlay"
  ).style.display = "none";

  if(savedLogin === "ADMIN"){
    adminPanel.style.display = "block";
  }

}

function guestLogin(){

  unlockedChild = "GAST";

  localStorage.setItem(
    "unlockedChild",
    "GAST"
  );

  document.getElementById(
    "loginOverlay"
  ).style.display = "none";

  loadAll();

}

function unlock(){

  const pin =
  document.getElementById("pinInput").value;

  if(pin === parentPin){

    unlockedChild = "ADMIN";

    localStorage.setItem(
      "unlockedChild",
      "ADMIN"
    );

    document.getElementById(
      "loginOverlay"
    ).style.display = "none";

    adminPanel.style.display = "block";

    loadAll();

    return;
  }

  const child =
  Object.keys(kidsConfig).find(
    k => kidsConfig[k].pin === pin
  );

  if(!child){

    alert("Falsche PIN");
    return;
  }

  unlockedChild = child;

  localStorage.setItem(
    "unlockedChild",
    child
  );

  document.getElementById(
    "loginOverlay"
  ).style.display = "none";

  loadAll();

}

function logout(){

  localStorage.removeItem(
    "unlockedChild"
  );

  location.reload();

}

async function api(action,payload={}){

  const response = await fetch(
    API_URL,
    {
      method:"POST",
      body:JSON.stringify({
        key:API_KEY,
        action,
        ...payload
      })
    }
  );

  const data =
  await response.json();

  if(!data.ok){
    throw new Error(
      data.error || "API Fehler"
    );
  }

  return data;

}

function countOpen(slots){

  return slots.filter(
    v => Number(v) > 0
  ).length;

}

function highestFilled(slots){

  for(
    let i = slots.length - 1;
    i >= 0;
    i--
  ){

    if(Number(slots[i]) > 0){
      return i;
    }

  }

  return -1;

}

async function loadAll(){

  await loadKids();
  await loadRewards();

}

async function loadKids(){

  const res =
  await api("getRange",{
    range:"A2:W4"
  });

  kidsData =
  res.values.map(row => {

    const slots =
    row.slice(3,23)
    .map(v => Number(v) || 0);

    return {
      name:row[0],
      points:Number(row[1]) || 0,
      unclaimed:countOpen(slots),
      slots
    };

  });

  renderKids();

}

async function loadRewards(){

  const res =
  await api("getRange",{
    range:`A${rewardsStartRow}:K${rewardsEndRow}`
  });

  rewardsData =
  res.values.map((row,i)=>({

    row:rewardsStartRow+i,

    id:row[0],

    title:row[1],

    target:Number(row[2]) || 0,

    images:[
      row[3],
      row[4],
      row[5]
    ].filter(Boolean),

    active:
      String(row[6]).toUpperCase() !== "FALSE"
      && !!row[1],

    visibleFor:row[7] || "ALL",

    Luna:Number(row[8]) || 0,
    Milo:Number(row[9]) || 0,
    Finn:Number(row[10]) || 0

  }))
  .filter(r => r.title);

  renderRewards();

}

function renderKids(){

  kidsContainer.innerHTML = "";

  kidsData.forEach(kid => {

    const percent =
    Math.min(
      (kid.points / 100) * 100,
      100
    );

    const width =
    percent > 0
    ? Math.max(percent,8)
    : 0;

    const card =
    document.createElement("div");

    card.className =
    `card ${kidsConfig[kid.name].className}`;

    card.innerHTML = `

      <div class="top">

        <div class="name">

          ${kid.name}

          ${
            kid.unclaimed > 0
            &&
            unlockedChild === kid.name

            ? `
              <button
                class="chest-button"
                onclick="claimLoot('${kid.name}')"
              >
                ⭐
              </button>
            `
            : ""
          }

        </div>

        <div class="points">
          ${kid.points} Punkte
        </div>

      </div>

      <div class="bar-bg">

        <div
          class="bar"
          style="width:${width}%"
        >
          ${Math.round(percent)}%
        </div>

      </div>

      <div class="info">
        ${kid.unclaimed} Belohnungen offen
      </div>

    `;

    kidsContainer.appendChild(card);

  });

}

function canSeeReward(reward){

  if(unlockedChild === "ADMIN"){
    return true;
  }

  if(reward.visibleFor === "ALL"){
    return true;
  }

  return reward.visibleFor === unlockedChild;

}

function renderRewards(){

  rewardsContainer.innerHTML = "";

  const visibleRewards =
  rewardsData.filter(
    r => r.active && canSeeReward(r)
  );

  visibleRewards.forEach(reward => {

    const total =
    reward.Luna +
    reward.Milo +
    reward.Finn;

    const percent =
    reward.target > 0
    ? Math.min(
      (total / reward.target) * 100,
      100
    )
    : 0;

    const width =
    percent > 0
    ? Math.max(percent,8)
    : 0;

    const image =
    reward.images.length
    ? reward.images[
      slideTick % reward.images.length
    ]
    : "";

    const card =
    document.createElement("div");

    card.className = "reward-card";

    card.innerHTML = `

      <img
        class="reward-img"
        src="${image}"
      >

      <div>

        <div class="reward-title">
          ${reward.title}
        </div>

        <div class="bar-bg">

          <div
            class="bar"
            style="width:${width}%"
          >
            ${Math.round(percent)}%
          </div>

        </div>

        <div class="reward-small">
          ${total} / ${reward.target} Punkte
        </div>

        <div class="reward-small">
          Luna: ${reward.Luna}
          ·
          Milo: ${reward.Milo}
          ·
          Finn: ${reward.Finn}
        </div>

      </div>

    `;

    rewardsContainer.appendChild(card);

  });

}

loadAll();

setInterval(()=>{
  slideTick++;
  renderRewards();
},3500);

</script>

</body>
</html>
