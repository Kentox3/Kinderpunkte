<!DOCTYPE html>

<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0
    "
  >

  <title>
    Kinderpunkte
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

  <!-- LOGIN -->

  <div id="loginMount"></div>

  <!-- APP -->

  <main>

    <h1>
      Kinderpunkte
    </h1>

    <!-- KIDS -->

    <section>

      <h2>
        Kinder
      </h2>

      <div id="kidsContainer">

        <div class="loading">
          Lade Kinder...
        </div>

      </div>

    </section>

    <!-- REWARDS -->

    <section>

      <h2>
        Belohnungen
      </h2>

      <div id="rewardsContainer">

        <div class="loading">
          Lade Belohnungen...
        </div>

      </div>

    </section>

    <!-- ADMIN -->

    <section id="adminMount"></section>

  </main>

  <!-- OVERLAY -->

  <div
    id="rewardOverlay"
    class="reward-overlay"
  >

    <div class="card">

      <h2>
        Belohnung geöffnet
      </h2>

      <div
        id="rewardOverlayText"
        class="name"
      >
        +0 Punkte
      </div>

    </div>

  </div>

  <!-- SCRIPTS -->

  <script
    type="module"
    src="js/app.js"
  ></script>

</body>

</html>
