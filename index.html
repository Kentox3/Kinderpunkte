<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinder Punkte</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.16), transparent 35%),
        linear-gradient(135deg, #10172f, #263b7a, #6d46c9);
      color: white;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    .container, .admin-box {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 24px;
    }

    .card, .admin-panel {
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 26px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "✨";
      position: absolute;
      right: 22px;
      top: 14px;
      opacity: 0.35;
      font-size: 1.4rem;
      animation: floatSparkle 2.8s ease-in-out infinite;
    }

    @keyframes floatSparkle {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.25;
      }

      50% {
        transform: translateY(-8px) rotate(15deg);
        opacity: 0.75;
      }
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .name {
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .points {
      font-size: 1.6rem;
      font-weight: bold;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(255,255,255,0.35);
    }

    .bar-bg {
      width: 100%;
      height: 36px;
      background: rgba(0,0,0,0.28);
      border-radius: 999px;
      overflow: hidden;
      padding: 4px;
      box-shadow:
        inset 0 0 12px rgba(0,0,0,0.45),
        0 0 18px rgba(255,255,255,0.12);
      position: relative;
      z-index: 2;
    }

    .bar {
      height: 100%;
      min-width: 42px;
      border-radius: 999px;
      transition: width 0.7s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 22px rgba(255,255,255,0.35);
    }

    .bar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,0.65) 35%,
          transparent 70%
        );

      transform: translateX(-100%);
      animation: shine 2.2s infinite;
    }

    .bar::after {
      content: "✦ ✨ ✦";
      position: absolute;
      left: 12px;
      font-size: 0.9rem;
      opacity: 0.75;
      animation: sparkleMove 1.8s ease-in-out infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-120%); }
      55% { transform: translateX(130%); }
      100% { transform: translateX(130%); }
    }

    @keyframes sparkleMove {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      50% {
        transform: translateY(-2px);
        opacity: 1;
      }
    }

    .luna .bar {
      background: linear-gradient(90deg, #ff7eb3, #ff4d97, #ffd1ec);
    }

    .milo .bar {
      background: linear-gradient(90deg, #5ee7ff, #1e90ff, #a9f2ff);
    }

    .finn .bar {
      background: linear-gradient(90deg, #8dff8d, #27c93f, #d6ffd6);
    }

    .loading, .error, .success {
      text-align: center;
      font-size: 1.1rem;
      border-radius: 20px;
      padding: 18px;
    }

    .loading {
      background: rgba(255,255,255,0.12);
    }

    .error {
      background: rgba(231, 76, 60, 0.25);
    }

    .success {
      background: rgba(46, 204, 113, 0.25);
    }

    .secret-button {
      display: block;
      margin: 60px auto 0 auto;
      background: transparent;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      opacity: 0.45;
    }

    .admin-panel {
      display: none;
      margin-top: 20px;
    }

    .admin-panel h2 {
      margin-top: 0;
      text-align: center;
    }

    .admin-grid {
      display: grid;
      gap: 14px;
    }

    input {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.1rem;
    }

    .checkbox-group {
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.12);
      padding: 14px;
      border-radius: 14px;
    }

    .checkbox-group label {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .checkbox-group input {
      width: auto;
      transform: scale(1.3);
      margin-right: 10px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.action {
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .plus {
      background: #2ecc71;
    }

    .minus {
      background: #e74c3c;
    }

    .open {
      background: #3498db;
    }

    .chest-button {
      border: none;
      background: rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
      animation: chestPulse 1.2s infinite;
    }

    @keyframes chestPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 8px rgba(255,255,255,0.25);
      }

      50% {
        transform: scale(1.12);
        box-shadow: 0 0 18px rgba(255,255,255,0.7);
      }
    }

    .click-star {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      z-index: 9999;
      animation: flyStar 900ms ease-out forwards;
    }

    @keyframes flyStar {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-70px) scale(1.6) rotate(35deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {

      body {
        padding: 16px;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .name {
        font-size: 1.7rem;
      }

      .points {
        font-size: 1.35rem;
      }
    }
  </style>
</head>

<body>

  <div class="container" id="container">
    <div class="loading">Punkte werden geladen...</div>
  </div>

  <button class="secret-button" onclick="showPinBox()">📝</button>

  <div class="admin-box">

    <div class="admin-panel" id="pinPanel">

      <h2>Notiz öffnen</h2>

      <div class="admin-grid">

        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          placeholder="PIN"
        >

        <button
          class="action open"
          onclick="unlockAdmin()"
        >
          Öffnen
        </button>

      </div>
    </div>

    <div class="admin-panel" id="adminPanel">

      <h2>Punkte ändern</h2>

      <div class="admin-grid">

        <div class="checkbox-group">
          <label><input type="checkbox" name="child" value="Luna"> Luna</label>
          <label><input type="checkbox" name="child" value="Milo"> Milo</label>
          <label><input type="checkbox" name="child" value="Finn"> Finn</label>
        </div>

        <input
          id="pointsAmount"
          type="number"
          min="1"
          value="1"
          placeholder="Punkte eingeben"
        >

        <div class="button-row">

          <button
            class="action plus"
            onclick="changeCustomPoints(1)"
          >
            + Punkte
          </button>

          <button
            class="action minus"
            onclick="changeCustomPoints(-1)"
          >
            - Punkte
          </button>

        </div>

        <div id="adminMessage"></div>

      </div>
    </div>
  </div>

  <script>

    const maxPoints = 100;

    const parentPin = "272520";

    const sheetApiUrl =
      "https://script.google.com/macros/s/AKfycbxh-YPrzSJX-_eRs2iaznnnVPS_oGbSHcz_MoPKqA22wSkoI7pdd5UZm8dlpZsplglWGw/exec";

    const colors = {
      luna: "luna",
      milo: "milo",
      finn: "finn"
    };

    const container =
      document.getElementById("container");

    const pinPanel =
      document.getElementById("pinPanel");

    const adminPanel =
      document.getElementById("adminPanel");

    const adminMessage =
      document.getElementById("adminMessage");

    function showPinBox() {

      pinPanel.style.display = "block";

      pinPanel.scrollIntoView({
        behavior: "smooth"
      });
    }

    function unlockAdmin() {

      const pin =
        document.getElementById("pinInput").value;

      if (pin === parentPin) {

        pinPanel.style.display = "none";
        adminPanel.style.display = "block";

      } else {

        alert("Falsche PIN");

      }
    }

    async function loadPoints() {

      try {

        const response =
          await fetch(sheetApiUrl);

        if (!response.ok) {
          throw new Error("Fehler");
        }

        const kids =
          await response.json();

        render(kids);

      } catch (error) {

        container.innerHTML = `
          <div class="error">
            Punkte konnten nicht geladen werden.
          </div>
        `;
      }
    }

    async function claimChest(name) {

      try {

        const response = await fetch(
          sheetApiUrl,
          {
            method: "POST",

            body: JSON.stringify({
              name: name,
              action: "claimChest"
            })
          }
        );

        const result = await response.json();

        if (result.success) {

          createStarBurst(
            window.innerWidth / 2,
            window.innerHeight / 2
          );

          await loadPoints();

        }

      } catch (error) {

        alert("Truhe konnte nicht geöffnet werden.");

      }
    }

    async function changeCustomPoints(direction) {

      const selectedChildren = Array.from(
        document.querySelectorAll(
          'input[name="child"]:checked'
        )
      ).map(input => input.value);

      const amount =
        Math.abs(
          Number(
            document.getElementById("pointsAmount").value
          )
        ) || 0;

      if (selectedChildren.length === 0) {

        alert("Bitte mindestens ein Kind auswählen.");
        return;

      }

      if (amount <= 0) {

        alert("Bitte Punkte eingeben.");
        return;

      }

      adminMessage.innerHTML =
        `<div class="loading">Speichere...</div>`;

      try {

        for (const name of selectedChildren) {

          await fetch(sheetApiUrl, {

            method: "POST",

            body: JSON.stringify({
              name: name,
              change: amount * direction
            })
          });
        }

        adminMessage.innerHTML = `
          <div class="success">
            Gespeichert:
            ${selectedChildren.join(", ")}
            ${direction > 0 ? "+" : "-"}${amount} Punkte
          </div>
        `;

        createStarBurst(
          window.innerWidth / 2,
          window.innerHeight / 2
        );

        await loadPoints();

      } catch (error) {

        adminMessage.innerHTML = `
          <div class="error">
            Speichern fehlgeschlagen
          </div>
        `;
      }
    }

    function render(kids) {

      container.innerHTML = "";

      kids.forEach(kid => {

        const name = kid.name;

        const points =
          Number(kid.points) || 0;

        const unclaimed =
          Number(kid.unclaimed) || 0;

        const className =
          colors[name.toLowerCase()] || "";

        const percent =
          Math.min(
            (points / maxPoints) * 100,
            100
          );

        const card =
          document.createElement("div");

        card.className =
          `card ${className}`;

        card.innerHTML = `
          <div class="top">

            <div class="name">

              ${name}

              ${unclaimed > 0
                ? `
                  <button
                    class="chest-button"
                    onclick="claimChest('${name}')"
                  >
                    🧰
                  </button>
                `
                : ""
              }

            </div>

            <div class="points">
              ${points} Punkte
            </div>

          </div>

          <div class="bar-bg">

            <div
              class="bar"
              style="width:${percent}%"
            >
              ${Math.round(percent)}%
            </div>

          </div>
        `;

        container.appendChild(card);

      });
    }

    function createStar(x, y) {

      const star =
        document.createElement("div");

      star.className = "click-star";

      star.textContent =
        ["⭐", "✨", "🌟", "💫"][
          Math.floor(Math.random() * 4)
        ];

      star.style.left = x + "px";
      star.style.top = y + "px";

      document.body.appendChild(star);

      setTimeout(() => {
        star.remove();
      }, 900);
    }

    function createStarBurst(x, y) {

      for (let i = 0; i < 12; i++) {

        setTimeout(() => {

          createStar(
            x + Math.random() * 120 - 60,
            y + Math.random() * 80 - 40
          );

        }, i * 40);
      }
    }

    document.addEventListener("click", function(e) {

      createStar(
        e.clientX,
        e.clientY
      );

    });

    loadPoints();

    setInterval(loadPoints, 10000);

  </script>

</body>
</html>
