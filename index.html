<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinder Punkte System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  padding:22px;
  background:
    radial-gradient(circle at top left,rgba(255,255,255,.16),transparent 35%),
    linear-gradient(135deg,#10172f,#263b7a,#6d46c9);
}
.container,.reward-box,.admin-box{
  max-width:950px;
  margin:auto;
  display:grid;
  gap:22px;
}
.card,.reward-card,.admin-panel{
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.18);
  border-radius:26px;
  padding:22px;
  backdrop-filter:blur(12px);
  box-shadow:0 14px 40px rgba(0,0,0,.28);
  overflow:hidden;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.name{
  font-size:2rem;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:10px;
}
.points{
  font-size:1.4rem;
  font-weight:bold;
}
.bar-bg{
  width:100%;
  height:34px;
  background:rgba(0,0,0,.28);
  border-radius:999px;
  overflow:hidden;
  padding:4px;
}
.bar{
  height:100%;
  min-width:42px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}
.luna .bar{background:linear-gradient(90deg,#ff7eb3,#ff4d97,#ffd1ec)}
.milo .bar{background:linear-gradient(90deg,#5ee7ff,#1e90ff,#a9f2ff)}
.finn .bar{background:linear-gradient(90deg,#8dff8d,#27c93f,#d6ffd6)}
.reward-card .bar{background:linear-gradient(90deg,#ffd86b,#ff9f43,#ffeaa7)}
.info,.reward-small{
  margin-top:8px;
  opacity:.9;
}
.reward-section-title{
  max-width:950px;
  margin:34px auto 12px;
  font-size:1.8rem;
  font-weight:bold;
}
.reward-card{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:18px;
  align-items:start;
}
.reward-img{
  width:180px;
  height:140px;
  object-fit:cover;
  border-radius:18px;
  background:rgba(0,0,0,.25);
}
.reward-title{
  font-size:1.5rem;
  font-weight:bold;
  margin-bottom:10px;
}
.reward-controls{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}
button,input,select{
  border:none;
  border-radius:14px;
  padding:12px;
  font-size:1rem;
}
input,select{
  width:100%;
}
button{
  cursor:pointer;
  color:white;
  font-weight:bold;
}
button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.plus{background:#2ecc71}
.minus{background:#e74c3c}
.save{background:#9b59b6}
.open{background:#3498db}
.logout-button{
  display:block;
  margin:45px auto 10px;
  background:rgba(255,255,255,.15);
}
.chest-button{
  background:rgba(255,255,255,.16);
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  50%{transform:scale(1.12)}
}
.admin-panel{
  display:none;
}
.admin-grid{
  display:grid;
  gap:12px;
}
.checkbox-group{
  display:grid;
  gap:8px;
  background:rgba(255,255,255,.12);
  padding:12px;
  border-radius:14px;
}
.checkbox-group input{
  width:auto;
  margin-right:8px;
}
.reward-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  flex-direction:column;
  text-align:center;
}
.big-star{
  font-size:7rem;
  filter:drop-shadow(0 0 25px gold);
}
.reward-text{
  font-size:2rem;
  margin-top:18px;
}
.loading,.error,.success{
  text-align:center;
  border-radius:18px;
  padding:16px;
}
.loading{background:rgba(255,255,255,.12)}
.error{background:rgba(231,76,60,.25)}
.success{background:rgba(46,204,113,.25)}
hr{
  border:0;
  border-top:1px solid rgba(255,255,255,.2);
  margin:10px 0;
}
@media(max-width:700px){
  .reward-card{grid-template-columns:1fr}
  .reward-img{width:100%;height:220px}
  .top{flex-direction:column;align-items:flex-start}
  .reward-controls{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginOverlay" class="reward-overlay" style="display:flex">
  <div class="admin-panel" style="display:block;max-width:360px;width:90%">
    <h2>⭐ Login</h2>
    <div class="admin-grid">
      <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN eingeben">
      <button class="open" onclick="unlock()">Einloggen</button>
      <button class="save" onclick="guestLogin()">Gastmodus</button>
    </div>
  </div>
</div>

<div id="lootOverlay" class="reward-overlay">
  <div class="big-star">⭐</div>
  <div id="lootText" class="reward-text"></div>
</div>

<div class="container" id="kidsContainer">
  <div class="loading">Lade Kinder...</div>
</div>

<div class="reward-section-title">🎁 Belohnungen</div>

<div class="reward-box" id="rewardsContainer">
  <div class="loading">Lade Belohnungen...</div>
</div>

<div class="admin-box">
  <div class="admin-panel" id="adminPanel">

    <h2>Loot vergeben</h2>

    <div class="admin-grid">
      <div class="checkbox-group">
        <label><input type="checkbox" name="lootChild" value="Luna">Luna</label>
        <label><input type="checkbox" name="lootChild" value="Milo">Milo</label>
        <label><input type="checkbox" name="lootChild" value="Finn">Finn</label>
      </div>

      <input id="lootAmount" type="number" value="5" min="1">

      <button class="plus" onclick="giveLoot()">Loot vergeben</button>

      <div id="adminMessage"></div>
    </div>

    <h2>Belohnung erstellen / bearbeiten</h2>

    <div class="admin-grid">
      <select id="rewardSelect" onchange="fillRewardForm()">
        <option value="">Neue Belohnung</option>
      </select>

      <input id="rewardTitle" placeholder="Titel">
      <input id="rewardTarget" type="number" min="1" placeholder="Zielpunkte">
      <input id="rewardImg1" placeholder="Bild URL 1">
      <input id="rewardImg2" placeholder="Bild URL 2">
      <input id="rewardImg3" placeholder="Bild URL 3">

      <select id="rewardVisibleFor">
        <option value="ALL">ALL</option>
        <option value="Luna">Luna</option>
        <option value="Milo">Milo</option>
        <option value="Finn">Finn</option>
      </select>

      <button class="save" onclick="saveReward()">Belohnung speichern</button>
      <button class="minus" onclick="deactivateReward()">Belohnung deaktivieren</button>

      <div id="rewardAdminInfo" class="info"></div>
    </div>

  </div>
</div>

<button class="logout-button" onclick="logout()">Logout</button>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzJnFU-3C8U0EpnnbvohU57t1cWQebdQVQCx76yBq_3bOtS_5POeba4uZkTaMcp93h7/exec";
const API_KEY="272520";

const parentPin="272520";
const maxPoints=100;

const kidsConfig={
  Luna:{row:2,pin:"271",className:"luna",contributionCol:"I"},
  Milo:{row:3,pin:"254",className:"milo",contributionCol:"J"},
  Finn:{row:4,pin:"207",className:"finn",contributionCol:"K"}
};

const firstLootColumn=4;
const lootSlots=20;
const rewardsStartRow=11;
const rewardsEndRow=40;

let unlockedChild=null;
let kidsData=[];
let rewardsData=[];
let slideTick=0;
let rewardCooldown=false;
let isSaving=false;

const kidsContainer=document.getElementById("kidsContainer");
const rewardsContainer=document.getElementById("rewardsContainer");
const adminPanel=document.getElementById("adminPanel");
const adminMessage=document.getElementById("adminMessage");

const savedLogin=localStorage.getItem("unlockedChild");

if(savedLogin){
  unlockedChild=savedLogin;
  document.getElementById("loginOverlay").style.display="none";

  if(savedLogin==="ADMIN"){
    adminPanel.style.display="block";
  }
}

function guestLogin(){
  unlockedChild="GAST";
  localStorage.setItem("unlockedChild","GAST");
  document.getElementById("loginOverlay").style.display="none";
  loadAll();
}

function unlock(){
  const pin=document.getElementById("pinInput").value;

  if(pin===parentPin){
    unlockedChild="ADMIN";
    localStorage.setItem("unlockedChild","ADMIN");
    document.getElementById("loginOverlay").style.display="none";
    adminPanel.style.display="block";
    loadAll();
    return;
  }

  const child=Object.keys(kidsConfig).find(k=>kidsConfig[k].pin===pin);

  if(!child){
    alert("Falsche PIN");
    return;
  }

  unlockedChild=child;
  localStorage.setItem("unlockedChild",child);
  document.getElementById("loginOverlay").style.display="none";
  loadAll();
}

function logout(){
  localStorage.removeItem("unlockedChild");
  location.reload();
}

async function api(action,payload={}){
  const response=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      key:API_KEY,
      action,
      ...payload
    })
  });

  const data=await response.json();

  if(!data.ok){
    throw new Error(data.error||"API Fehler");
  }

  return data;
}

function col(n){
  let s="";
  while(n>0){
    const r=(n-1)%26;
    s=String.fromCharCode(65+r)+s;
    n=Math.floor((n-1)/26);
  }
  return s;
}

function lootCell(row,index){
  return `${col(firstLootColumn+index)}${row}`;
}

function countOpen(slots){
  return slots.filter(v=>Number(v)>0).length;
}

function highestFilled(slots){
  for(let i=slots.length-1;i>=0;i--){
    if(Number(slots[i])>0){
      return i;
    }
  }
  return -1;
}

function nextFree(slots){
  return slots.findIndex(v=>Number(v)<=0);
}

function setRewardButtonsDisabled(disabled){
  document.querySelectorAll(".reward-action").forEach(btn=>{
    btn.disabled=disabled;
  });
}

async function setupSheet(){
  const res=await api("getRange",{range:"A1:W4"});

  if(res.values?.[0]?.[0]){
    return;
  }

  const headers=["Name","Punkte","Unclaimed"];

  for(let i=1;i<=20;i++){
    headers.push("U"+i);
  }

  await api("setRange",{
    range:"A1:W4",
    values:[
      headers,
      ["Luna",0,0,...Array(20).fill(0)],
      ["Milo",0,0,...Array(20).fill(0)],
      ["Finn",0,0,...Array(20).fill(0)]
    ]
  });
}

async function setupRewards(){
  const res=await api("getRange",{range:"A10:K10"});

  if(res.values?.[0]?.[0]){
    return;
  }

  await api("setRange",{
    range:"A10:K10",
    values:[
      ["RewardID","Titel","Zielpunkte","Bild1","Bild2","Bild3","Aktiv","SichtbarFür","Luna","Milo","Finn"]
    ]
  });
}

async function loadAll(){
  try{
    await setupSheet();
    await setupRewards();
    await loadKids();
    await loadRewards();
  }catch(error){
    console.error(error);
    kidsContainer.innerHTML=`<div class="error">${error.message}</div>`;
  }
}

async function loadKids(){
  const res=await api("getRange",{range:"A2:W4"});

  kidsData=res.values.map(row=>{
    const slots=row.slice(3,23).map(v=>Number(v)||0);

    return{
      name:row[0],
      points:Number(row[1])||0,
      unclaimed:countOpen(slots),
      slots
    };
  }).filter(k=>kidsConfig[k.name]);

  const updates=kidsData.map(k=>({
    cell:`C${kidsConfig[k.name].row}`,
    value:k.unclaimed
  }));

  if(updates.length){
    await api("setMany",{data:updates});
  }

  renderKids();
}

async function loadRewards(){
  const res=await api("getRange",{range:`A${rewardsStartRow}:K${rewardsEndRow}`});

  rewardsData=res.values.map((row,i)=>({
    row:rewardsStartRow+i,
    id:row[0],
    title:row[1],
    target:Number(row[2])||0,
    images:[row[3],row[4],row[5]].filter(Boolean),
    active:String(row[6]).toUpperCase()!=="FALSE" && !!row[1],
    visibleFor:row[7]||"ALL",
    Luna:Number(row[8])||0,
    Milo:Number(row[9])||0,
    Finn:Number(row[10])||0
  })).filter(r=>r.title);

  renderRewards();
  renderRewardAdmin();
}

function renderKids(){
  kidsContainer.innerHTML="";

  kidsData.forEach(kid=>{
    const percent=Math.min((kid.points/maxPoints)*100,100);
    const width=percent>0?Math.max(percent,8):0;

    const card=document.createElement("div");
    card.className=`card ${kidsConfig[kid.name].className}`;

    card.innerHTML=`
      <div class="top">
        <div class="name">
          ${kid.name}
          ${
            kid.unclaimed>0 && unlockedChild===kid.name
            ? `<button class="chest-button" onclick="claimLoot('${kid.name}')">⭐</button>`
            : ""
          }
        </div>
        <div class="points">${kid.points} Punkte</div>
      </div>

      <div class="bar-bg">
        <div class="bar" style="width:${width}%">${Math.round(percent)}%</div>
      </div>

      <div class="info">${kid.unclaimed} Belohnungen offen</div>
    `;

    kidsContainer.appendChild(card);
  });
}

function canSeeReward(reward){
  if(unlockedChild==="ADMIN"){
    return true;
  }

  if(reward.visibleFor==="ALL"){
    return true;
  }

  return reward.visibleFor===unlockedChild;
}

function renderRewards(){
  rewardsContainer.innerHTML="";

  const visibleRewards=rewardsData.filter(r=>r.active && canSeeReward(r));

  if(!visibleRewards.length){
    rewardsContainer.innerHTML=`<div class="loading">Keine Belohnungen sichtbar.</div>`;
    return;
  }

  visibleRewards.forEach(reward=>{
    const total=reward.Luna+reward.Milo+reward.Finn;
    const percent=reward.target>0?Math.min((total/reward.target)*100,100):0;
    const width=percent>0?Math.max(percent,8):0;
    const image=reward.images.length?reward.images[slideTick%reward.images.length]:"";

    const card=document.createElement("div");
    card.className="reward-card";

    card.innerHTML=`
      <img class="reward-img" src="${image}" onerror="this.style.display='none'">

      <div>
        <div class="reward-title">${reward.title}</div>

        <div class="bar-bg">
          <div class="bar" style="width:${width}%">${Math.round(percent)}%</div>
        </div>

        <div class="reward-small">${total} / ${reward.target} Punkte</div>
        <div class="reward-small">Luna: ${reward.Luna} · Milo: ${reward.Milo} · Finn: ${reward.Finn}</div>
        <div class="reward-small">Sichtbar für: ${reward.visibleFor}</div>

        ${
          unlockedChild && unlockedChild!=="ADMIN" && unlockedChild!=="GAST"
          ? `
            <div class="reward-controls">
              <input type="number" min="1" value="5" id="amount-${reward.row}">
              <button class="plus reward-action" onclick="donate(${reward.row})">+</button>
              <button class="minus reward-action" onclick="withdraw(${reward.row})">-</button>
            </div>
          `
          : ""
        }
      </div>
    `;

    rewardsContainer.appendChild(card);
  });
}

async function donate(row){
  if(isSaving || rewardCooldown){
    return;
  }

  rewardCooldown=true;
  isSaving=true;
  setRewardButtonsDisabled(true);

  setTimeout(()=>{
    rewardCooldown=false;
    setRewardButtonsDisabled(false);
  },5000);

  try{
    await loadKids();
    await loadRewards();

    const amount=Number(document.getElementById(`amount-${row}`)?.value)||0;

    if(amount<=0){
      throw new Error("Bitte Punkte eingeben.");
    }

    const child=kidsConfig[unlockedChild];
    const kid=kidsData.find(k=>k.name===unlockedChild);
    const reward=rewardsData.find(r=>r.row===row);

    if(!child || !kid || !reward){
      throw new Error("Daten nicht gefunden.");
    }

    if(kid.points<amount){
      throw new Error("Nicht genug Punkte.");
    }

    const currentContribution=Number(reward[unlockedChild])||0;

    await api("setMany",{
      data:[
        {cell:`B${child.row}`,value:kid.points-amount},
        {cell:`${child.contributionCol}${row}`,value:currentContribution+amount}
      ]
    });

    await loadAll();
  }catch(error){
    alert(error.message);
  }

  isSaving=false;
}

async function withdraw(row){
  if(isSaving || rewardCooldown){
    return;
  }

  rewardCooldown=true;
  isSaving=true;
  setRewardButtonsDisabled(true);

  setTimeout(()=>{
    rewardCooldown=false;
    setRewardButtonsDisabled(false);
  },5000);

  try{
    await loadKids();
    await loadRewards();

    const amount=Number(document.getElementById(`amount-${row}`)?.value)||0;

    if(amount<=0){
      throw new Error("Bitte Punkte eingeben.");
    }

    const child=kidsConfig[unlockedChild];
    const kid=kidsData.find(k=>k.name===unlockedChild);
    const reward=rewardsData.find(r=>r.row===row);

    if(!child || !kid || !reward){
      throw new Error("Daten nicht gefunden.");
    }

    const currentContribution=Number(reward[unlockedChild])||0;

    if(currentContribution<amount){
      throw new Error("Du kannst nur deine eigenen eingezahlten Punkte zurücknehmen.");
    }

    await api("setMany",{
      data:[
        {cell:`B${child.row}`,value:kid.points+amount},
        {cell:`${child.contributionCol}${row}`,value:currentContribution-amount}
      ]
    });

    await loadAll();
  }catch(error){
    alert(error.message);
  }

  isSaving=false;
}

async function claimLoot(name){
  if(unlockedChild!==name){
    return;
  }

  const row=kidsConfig[name].row;

  const res=await api("getRange",{range:`A${row}:W${row}`});
  const rowValues=res.values[0]||[];

  const currentPoints=Number(rowValues[1])||0;
  const slots=rowValues.slice(3,23).map(v=>Number(v)||0);
  const slotIndex=highestFilled(slots);

  if(slotIndex===-1){
    return;
  }

  const reward=slots[slotIndex];
  slots[slotIndex]=0;

  await api("setMany",{
    data:[
      {cell:`B${row}`,value:currentPoints+reward},
      {cell:`C${row}`,value:countOpen(slots)},
      {cell:lootCell(row,slotIndex),value:0}
    ]
  });

  const overlay=document.getElementById("lootOverlay");
  const text=document.getElementById("lootText");

  text.innerHTML=`+${reward} Punkte<br><small>${countOpen(slots)} Belohnungen übrig</small>`;
  overlay.style.display="flex";

  setTimeout(()=>{
    overlay.style.display="none";
  },1500);

  await loadKids();
}

async function giveLoot(){
  const selected=[...document.querySelectorAll('input[name="lootChild"]:checked')].map(input=>input.value);
  const amount=Number(document.getElementById("lootAmount").value)||0;

  if(!selected.length){
    alert("Bitte mindestens ein Kind auswählen.");
    return;
  }

  if(amount<=0){
    alert("Bitte Loot-Wert eingeben.");
    return;
  }

  const updates=[];
  const messages=[];

  for(const name of selected){
    const row=kidsConfig[name].row;

    const res=await api("getRange",{range:`D${row}:W${row}`});
    const slots=res.values[0].map(v=>Number(v)||0);
    const free=nextFree(slots);

    if(free===-1){
      messages.push(`${name}: keine freien Slots`);
      continue;
    }

    slots[free]=amount;

    updates.push({cell:lootCell(row,free),value:amount});
    updates.push({cell:`C${row}`,value:countOpen(slots)});

    messages.push(`${name}: +${amount} in U${free+1}`);
  }

  if(updates.length){
    await api("setMany",{data:updates});
  }

  adminMessage.innerHTML=`<div class="success">${messages.join("<br>")}</div>`;
  await loadKids();
}

function renderRewardAdmin(){
  const select=document.getElementById("rewardSelect");

  const currentValue=select.value;

  select.innerHTML=`<option value="">Neue Belohnung</option>`;

  rewardsData.forEach(r=>{
    select.innerHTML+=`<option value="${r.row}">${r.title}</option>`;
  });

  if(currentValue){
    select.value=currentValue;
  }

  const info=document.getElementById("rewardAdminInfo");

  if(!rewardsData.length){
    info.innerHTML="Noch keine Belohnungen.";
    return;
  }

  info.innerHTML=rewardsData.map(r=>{
    const total=r.Luna+r.Milo+r.Finn;

    return `
      <b>${r.title}</b><br>
      Ziel: ${r.target}<br>
      Sichtbar für: ${r.visibleFor}<br>
      Aktiv: ${r.active ? "Ja" : "Nein"}<br>
      Luna: ${r.Luna}, Milo: ${r.Milo}, Finn: ${r.Finn}<br>
      Gesamt: ${total}
      <hr>
    `;
  }).join("");
}

function fillRewardForm(){
  const row=Number(document.getElementById("rewardSelect").value);
  const reward=rewardsData.find(r=>r.row===row);

  document.getElementById("rewardTitle").value=reward?.title||"";
  document.getElementById("rewardTarget").value=reward?.target||"";
  document.getElementById("rewardImg1").value=reward?.images?.[0]||"";
  document.getElementById("rewardImg2").value=reward?.images?.[1]||"";
  document.getElementById("rewardImg3").value=reward?.images?.[2]||"";
  document.getElementById("rewardVisibleFor").value=reward?.visibleFor||"ALL";
}

async function saveReward(){
  const selectedRow=Number(document.getElementById("rewardSelect").value);
  const title=document.getElementById("rewardTitle").value.trim();
  const target=Number(document.getElementById("rewardTarget").value)||0;
  const img1=document.getElementById("rewardImg1").value.trim();
  const img2=document.getElementById("rewardImg2").value.trim();
  const img3=document.getElementById("rewardImg3").value.trim();
  const visibleFor=document.getElementById("rewardVisibleFor").value;

  if(!title){
    alert("Titel fehlt.");
    return;
  }

  if(target<=0){
    alert("Zielpunkte fehlen.");
    return;
  }

  let row=selectedRow;

  if(!row){
    const usedRows=rewardsData.map(r=>r.row);

    for(let r=rewardsStartRow;r<=rewardsEndRow;r++){
      if(!usedRows.includes(r)){
        row=r;
        break;
      }
    }
  }

  if(!row){
    alert("Keine freien Reward-Zeilen mehr.");
    return;
  }

  const existing=rewardsData.find(r=>r.row===row);

  const id=existing?.id||`R${Date.now()}`;
  const luna=existing?.Luna||0;
  const milo=existing?.Milo||0;
  const finn=existing?.Finn||0;

  await api("setRange",{
    range:`A${row}:K${row}`,
    values:[[
      id,
      title,
      target,
      img1,
      img2,
      img3,
      true,
      visibleFor,
      luna,
      milo,
      finn
    ]]
  });

  await loadRewards();

  document.getElementById("rewardSelect").value=row;

  alert("Belohnung gespeichert.");
}

async function deactivateReward(){
  const row=Number(document.getElementById("rewardSelect").value);

  if(!row){
    alert("Bitte Belohnung auswählen.");
    return;
  }

  await api("set",{
    cell:`G${row}`,
    value:false
  });

  await loadRewards();

  alert("Belohnung deaktiviert.");
}

loadAll();

setInterval(()=>{
  slideTick++;
  renderRewards();
},3500);

setInterval(loadAll,15000);
</script>
