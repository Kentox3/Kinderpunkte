<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinder Punkte Loot-Chain</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.16), transparent 35%),
        linear-gradient(135deg, #10172f, #263b7a, #6d46c9);
      color: white;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 24px;
    }

    .card {
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 26px;
      padding: 24px;
      backdrop-filter: blur(12px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .name {
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .points {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .unclaimed {
      margin-top: 10px;
      opacity: 0.9;
    }

    .bar-bg {
      width: 100%;
      height: 36px;
      background: rgba(0,0,0,0.28);
      border-radius: 999px;
      overflow: hidden;
      padding: 4px;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .luna .bar {
      background: linear-gradient(90deg, #ff7eb3, #ff4d97, #ffd1ec);
    }

    .milo .bar {
      background: linear-gradient(90deg, #5ee7ff, #1e90ff, #a9f2ff);
    }

    .finn .bar {
      background: linear-gradient(90deg, #8dff8d, #27c93f, #d6ffd6);
    }

    .chest-button {
      border: none;
      background: rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container" id="container"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzJnFU-3C8U0EpnnbvohU57t1cWQebdQVQCx76yBq_3bOtS_5POeba4uZkTaMcp93h7/exec";
const API_KEY = "272520";

const maxPoints = 100;

/*

A = Name
B = Punkte
C = Unclaimed Counter
D-W = U1-U20

*/

const firstLootColumnIndex = 4;
const lootSlots = 20;

const kidsConfig = {
  Luna: { row: 2, className: "luna" },
  Milo: { row: 3, className: "milo" },
  Finn: { row: 4, className: "finn" }
};

const container = document.getElementById("container");

function columnLetter(columnNumber) {

  let letter = "";

  while (columnNumber > 0) {

    const remainder = (columnNumber - 1) % 26;

    letter =
      String.fromCharCode(65 + remainder) +
      letter;

    columnNumber = Math.floor((columnNumber - 1) / 26);

  }

  return letter;

}

function lootCell(row, slotIndex) {

  const column =
    firstLootColumnIndex + slotIndex;

  return `${columnLetter(column)}${row}`;

}

function countOpenRewards(slots) {

  return slots.filter(
    value => Number(value) > 0
  ).length;

}

function findNextFreeSlot(slots) {

  return slots.findIndex(
    value => Number(value) <= 0
  );

}

function findHighestFilledSlot(slots) {

  for (
    let i = slots.length - 1;
    i >= 0;
    i--
  ) {

    if (Number(slots[i]) > 0) {
      return i;
    }

  }

  return -1;

}

async function api(action, payload = {}) {

  const response = await fetch(API_URL, {

    method: "POST",

    body: JSON.stringify({
      key: API_KEY,
      action,
      ...payload
    })

  });

  const data = await response.json();

  if (!data.ok) {
    throw new Error(data.error || "API Fehler");
  }

  return data;

}

async function loadPoints() {

  const result = await api("getRange", {
    range: "A2:W4"
  });

  const kids = result.values.map(row => {

    const slots =
      row.slice(3, 23)
        .map(value => Number(value) || 0);

    return {
      name: row[0],
      points: Number(row[1]) || 0,
      unclaimed: countOpenRewards(slots),
      slots
    };

  });

  render(kids);

}

async function claimChest(name) {

  const row = kidsConfig[name].row;

  const result = await api("getRange", {
    range: `A${row}:W${row}`
  });

  const rowValues = result.values[0] || [];

  const currentPoints =
    Number(rowValues[1]) || 0;

  const slots =
    rowValues.slice(3, 23)
      .map(value => Number(value) || 0);

  const slotIndex =
    findHighestFilledSlot(slots);

  if (slotIndex === -1) {
    return;
  }

  const reward =
    Number(slots[slotIndex]) || 0;

  slots[slotIndex] = 0;

  const remainingRewards =
    countOpenRewards(slots);

  await api("setMany", {

    data: [

      {
        cell: `B${row}`,
        value: currentPoints + reward
      },

      {
        cell: `C${row}`,
        value: remainingRewards
      },

      {
        cell: lootCell(row, slotIndex),
        value: 0
      }

    ]

  });

  await loadPoints();

}

async function addLoot(name, amount) {

  const row = kidsConfig[name].row;

  const result = await api("getRange", {
    range: `D${row}:W${row}`
  });

  const slots =
    result.values[0]
      .map(value => Number(value) || 0);

  const nextFreeSlot =
    findNextFreeSlot(slots);

  if (nextFreeSlot === -1) {
    alert("Keine freien Loot-Slots mehr");
    return;
  }

  await api("setMany", {

    data: [

      {
        cell: lootCell(row, nextFreeSlot),
        value: amount
      },

      {
        cell: `C${row}`,
        value: countOpenRewards([
          ...slots.slice(0, nextFreeSlot),
          amount,
          ...slots.slice(nextFreeSlot + 1)
        ])
      }

    ]

  });

  await loadPoints();

}

function render(kids) {

  container.innerHTML = "";

  kids.forEach(kid => {

    const name = kid.name;

    if (!name || !kidsConfig[name]) {
      return;
    }

    const points = Number(kid.points) || 0;
    const unclaimed = Number(kid.unclaimed) || 0;

    const percent = Math.min(
      (points / maxPoints) * 100,
      100
    );

    const card = document.createElement("div");

    card.className =
      `card ${kidsConfig[name].className}`;

    card.innerHTML = `

      <div class="top">

        <div class="name">

          ${name}

          ${
            unclaimed > 0
            ? `
                <button
                  class="chest-button"
                  onclick="claimChest('${name}')"
                >
                  ⭐
                </button>
              `
            : ""
          }

        </div>

        <div class="points">
          ${points} Punkte
        </div>

      </div>

      <div class="bar-bg">

        <div
          class="bar"
          style="width:${percent}%"
        >
          ${Math.round(percent)}%
        </div>

      </div>

      <div class="unclaimed">
        ${unclaimed} Belohnungen offen
      </div>

    `;

    container.appendChild(card);

  });

}

loadPoints();

setInterval(loadPoints, 10000);

</script>

</body>
</html>
