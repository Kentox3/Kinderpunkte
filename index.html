<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Kinderpunkte</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#8b5dff" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kinderpunkte" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

</head>

<body>

  <!-- LOGIN -->
  <div id="loginMount"></div>

  <!-- MAIN -->
  <main>

    <!-- KIDS -->
    <div id="kidsContainer"></div>

    <!-- REWARDS -->
    <h2>🎁 Belohnungen</h2>
    <div id="rewardsContainer"></div>

    <!-- ADMIN -->
    <div id="adminMount"></div>

    <!-- LOGOUT + RELOAD -->
    <div style="display:flex; gap:8px; margin-top:12px">
      <button id="logoutButton" class="minus logout-bottom" style="flex:1">
        🚪 Logout
      </button>
      <button id="hardReloadButtonUser" class="minus logout-bottom" style="flex:1">
        🔄 Neu laden
      </button>
    </div>

  </main>

  <!-- REWARD OVERLAY -->
  <div id="rewardOverlay" class="reward-overlay">
    <div class="card">
      <div id="rewardOverlayText">🎁</div>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(reg => console.log("SW registriert:", reg.scope))
          .catch(err => console.error("SW Fehler:", err));
      });
    }
  </script>

</body>

</html>
