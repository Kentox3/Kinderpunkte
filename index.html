<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinder Punkte Anzeige</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #182848, #4b6cb7);
      color: white;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 2.5rem;
    }

    .subtitle {
      text-align: center;
      opacity: 0.85;
      margin-bottom: 24px;
      font-size: 1.1rem;
    }

    .container, .admin-box {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 24px;
    }

    .card, .admin-panel {
      background: rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 16px;
    }

    .name {
      font-size: 2rem;
      font-weight: bold;
    }

    .points {
      font-size: 1.6rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .bar-bg {
      width: 100%;
      height: 32px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: bold;
    }

    .luna .bar {
      background: linear-gradient(90deg, #ff7eb3, #ff4d97);
    }

    .milo .bar {
      background: linear-gradient(90deg, #66d9ff, #1e90ff);
    }

    .finn .bar {
      background: linear-gradient(90deg, #8dff8d, #27c93f);
    }

    .loading, .error, .success {
      max-width: 900px;
      margin: 20px auto;
      text-align: center;
      font-size: 1.1rem;
      border-radius: 20px;
      padding: 18px;
    }

    .loading {
      background: rgba(255,255,255,0.12);
    }

    .error {
      background: rgba(231, 76, 60, 0.25);
    }

    .success {
      background: rgba(46, 204, 113, 0.25);
    }

    .admin-toggle {
      display: block;
      margin: 0 auto 24px auto;
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255,255,255,0.9);
      color: #182848;
    }

    .admin-panel {
      margin-bottom: 28px;
      display: none;
    }

    .admin-panel h2 {
      margin-top: 0;
      text-align: center;
    }

    .admin-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr;
    }

    input, select {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.1rem;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button.action {
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .plus1 {
      background: #2ecc71;
    }

    .plus5 {
      background: #3498db;
    }

    .minus1 {
      background: #e74c3c;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      h1 {
        font-size: 2rem;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .name {
        font-size: 1.7rem;
      }

      .points {
        font-size: 1.35rem;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <h1>⭐ Kinder Punkte ⭐</h1>
  <div class="subtitle">Live aus Google Sheets</div>

  <button class="admin-toggle" onclick="showPinBox()">Elternbereich</button>

  <div class="admin-box">
    <div class="admin-panel" id="pinPanel">
      <h2>Eltern-PIN</h2>
      <div class="admin-grid">
        <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN eingeben">
        <button class="action plus5" onclick="unlockAdmin()">Öffnen</button>
      </div>
    </div>

    <div class="admin-panel" id="adminPanel">
      <h2>Punkte vergeben</h2>
      <div class="admin-grid">
        <select id="childSelect">
          <option value="Luna">Luna</option>
          <option value="Milo">Milo</option>
          <option value="Finn">Finn</option>
        </select>

        <div class="button-row">
          <button class="action plus1" onclick="changePoints(1)">+1 Punkt</button>
          <button class="action plus5" onclick="changePoints(5)">+5 Punkte</button>
          <button class="action minus1" onclick="changePoints(-1)">-1 Punkt</button>
        </div>

        <div id="adminMessage"></div>
      </div>
    </div>
  </div>

  <div class="container" id="container">
    <div class="loading">Punkte werden geladen...</div>
  </div>

  <script>
    const maxPoints = 100;
    const parentPin = "1234";

    const sheetApiUrl = "https://script.google.com/macros/s/AKfycbyg5aGdbtPEKkRDA0evoSdupgLgDkeE_yNxCMvWzTiV9h-ZjO-uwpjXowynEt4DNplQrA/exec";

    const colors = {
      luna: "luna",
      milo: "milo",
      finn: "finn"
    };

    const container = document.getElementById("container");
    const pinPanel = document.getElementById("pinPanel");
    const adminPanel = document.getElementById("adminPanel");
    const adminMessage = document.getElementById("adminMessage");

    function showPinBox() {
      pinPanel.style.display = "block";
    }

    function unlockAdmin() {
      const pin = document.getElementById("pinInput").value;

      if (pin === parentPin) {
        pinPanel.style.display = "none";
        adminPanel.style.display = "block";
      } else {
        alert("Falsche PIN");
      }
    }

    async function loadPoints() {
      try {
        const response = await fetch(sheetApiUrl);

        if (!response.ok) {
          throw new Error("Fehler beim Laden der Daten");
        }

        const kids = await response.json();
        render(kids);
      } catch (error) {
        container.innerHTML = `
          <div class="error">
            Punkte konnten nicht geladen werden.<br>
            Prüfe die Google Apps Script URL.
          </div>
        `;
      }
    }

    async function changePoints(amount) {
      const name = document.getElementById("childSelect").value;
      adminMessage.innerHTML = `<div class="loading">Speichere...</div>`;

      try {
        await fetch(sheetApiUrl, {
          method: "POST",
          body: JSON.stringify({
            name: name,
            change: amount
          })
        });

        adminMessage.innerHTML = `<div class="success">${name}: ${amount > 0 ? "+" : ""}${amount} Punkt(e) gespeichert</div>`;
        await loadPoints();
      } catch (error) {
        adminMessage.innerHTML = `<div class="error">Speichern fehlgeschlagen</div>`;
      }
    }

    function render(kids) {
      container.innerHTML = "";

      kids.forEach(kid => {
        const name = kid.name;
        const points = Number(kid.points) || 0;
        const className = colors[name.toLowerCase()] || "";
        const percent = Math.min((points / maxPoints) * 100, 100);

        const card = document.createElement("div");
        card.className = `card ${className}`;

        card.innerHTML = `
          <div class="top">
            <div class="name">${name}</div>
            <div class="points">${points} Punkte</div>
          </div>

          <div class="bar-bg">
            <div class="bar" style="width:${percent}%">
              ${Math.round(percent)}%
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    loadPoints();
    setInterval(loadPoints, 10000);
  </script>

</body>
</html>
