<div
  id="loginOverlay"
  class="visible"
>

  <div class="login-box">

    <h2>
      🌟 Kinderpunkte
    </h2>

    <div class="info">
      Willkommen zurück ✨
    </div>

    <input
      id="pinInput"
      type="password"
      placeholder="PIN eingeben"
      autocomplete="off"
    >

    <button
      id="loginButton"
      class="save"
    >
      🚀 Login
    </button>

    <button
      id="guestButton"
      class="plus"
    >
      👀 Als Gast ansehen
    </button>

  </div>

</div>
