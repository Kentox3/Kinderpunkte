<div

      width:90%;
    "
  >

    <h2>
      ⭐ Login
    </h2>

    <div class="admin-grid">

      <input
        id="pinInput"
        type="password"
        inputmode="numeric"

      <button

        Einloggen
      </button>

      <button
        class="save"
        id="guestButton"

        Gastmodus
      </button>

    </div>

  </div>

</div>

  class="reward-overlay"
>

  <div
