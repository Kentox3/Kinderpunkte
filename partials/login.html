<div
  id="loginOverlay"
  class="visible"
>

  <div class="login-box">

    <h2>
      Kinderpunkte
    </h2>

    <input
      id="pinInput"
      type="password"
      placeholder="PIN eingeben"
    >

    <button
      id="loginButton"
      class="save"
    >
      Login
    </button>

    <button
      id="guestButton"
      class="plus"
    >
      Als Gast ansehen
    </button>

    <button
      id="logoutButton"
      class="minus"
    >
      Logout
    </button>

  </div>

</div>
