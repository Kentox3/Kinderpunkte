<div
  class="admin-panel"
>

  <h2>
    Admin Bereich
  </h2>

  <!-- LOOT -->

  <details class="admin-dropdown">

    <summary>
      🎁 Loot vergeben
    </summary>

    <div class="admin-grid">

      <select id="adminLootChild">

        <option value="Luna">
          Luna
        </option>

        <option value="Milo">
          Milo
        </option>

        <option value="Finn">
          Finn
        </option>

      </select>

      <input
        id="adminLootAmount"
        type="number"
        min="1"
        placeholder="Loot Punkte"
      >

      <button
        id="adminLootButton"
        class="plus"
      >
        ➕ Loot vergeben
      </button>

    </div>

  </details>

  <!-- REWARD -->

  <details class="admin-dropdown">

    <summary>
      🏆 Reward erstellen
    </summary>

    <div class="admin-grid">

      <input
        id="rewardTitle"
        placeholder="Reward Titel"
      >

      <input
        id="rewardGoal"
        type="number"
        min="1"
        placeholder="Benötigte Punkte"
      >

      <input
        id="rewardImage1"
        placeholder="Bild URL 1"
      >

      <input
        id="rewardImage2"
        placeholder="Bild URL 2"
      >

      <input
        id="rewardImage3"
        placeholder="Bild URL 3"
      >

      <select id="rewardVisibleFor">

        <option value="ALL">
          Für alle
        </option>

        <option value="Luna">
          Nur Luna
        </option>

        <option value="Milo">
          Nur Milo
        </option>

        <option value="Finn">
          Nur Finn
        </option>

      </select>

      <button
        id="saveRewardButton"
        class="save"
      >
        💾 Reward speichern
      </button>

    </div>

  </details>

  <!-- STREAK -->

  <details class="admin-dropdown">

    <summary>
      🔥 Streak erstellen
    </summary>

    <div class="admin-grid">

      <select id="streakChild">

        <option value="Luna">
          Luna
        </option>

        <option value="Milo">
          Milo
        </option>

        <option value="Finn">
          Finn
        </option>

      </select>

      <input
        id="streakTitle"
        placeholder="Streak Titel"
      >

      <input
        id="streakEmoji"
        placeholder="Emoji"
      >

      <input
        id="streakGoal"
        type="number"
        min="1"
        placeholder="Ziel"
      >

      <input
        id="streakPoints"
        type="number"
        min="1"
        placeholder="Loot pro Klick"
      >

      <input
        id="streakBonus"
        type="number"
        min="1"
        placeholder="Streak Bonus"
      >

      <button
        id="saveStreakButton"
        class="save"
      >
        🔥 Streak speichern
      </button>

    </div>

  </details>

  <!-- PURCHASES -->

  <details class="admin-dropdown">

    <summary>
      🛒 Gekaufte Rewards
    </summary>

    <div
      id="purchasesList"
      class="admin-grid"
    >

      <div class="loading">
        Lade Käufe...
      </div>

    </div>

  </details>

</div>
