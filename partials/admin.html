<div
  id="adminPanel"
  class="admin-panel"
>

  <!-- LOOT -->

  <details
    class="admin-dropdown"
    open
  >

    <summary>
      Loot vergeben
    </summary>

    <div class="admin-grid">

      <div class="checkbox-group">

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Luna"
          >
          Luna
        </label>

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Milo"
          >
          Milo
        </label>

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Finn"
          >
          Finn
        </label>

      </div>

      <input
        id="lootAmount"
        type="number"
        placeholder="Loot Wert"
        value="5"
      >

      <button
        id="giveLootButton"
        class="plus"
      >
        Loot vergeben
      </button>

      <div id="adminMessage"></div>

    </div>

  </details>

  <!-- REWARDS -->

  <details class="admin-dropdown">

    <summary>
      Belohnung erstellen
    </summary>

    <div class="admin-grid">

      <select id="rewardSelect">

        <option value="">
          Neue Belohnung
        </option>

      </select>

      <input
        id="rewardTitle"
        placeholder="Titel"
      >

      <input
        id="rewardTarget"
        type="number"
        placeholder="Zielpunkte"
      >

      <input
        id="rewardImg1"
        placeholder="Bild URL 1"
      >

      <input
        id="rewardImg2"
        placeholder="Bild URL 2"
      >

      <input
        id="rewardImg3"
        placeholder="Bild URL 3"
      >

      <select id="rewardVisibleFor">

        <option value="ALL">
          Alle Kinder
        </option>

        <option value="Luna">
          Nur Luna
        </option>

        <option value="Milo">
          Nur Milo
        </option>

        <option value="Finn">
          Nur Finn
        </option>

      </select>

      <button
        id="saveRewardButton"
        class="save"
      >
        Belohnung speichern
      </button>

      <button
        id="deactivateRewardButton"
        class="minus"
      >
        Belohnung deaktivieren
      </button>

      <div id="rewardAdminInfo"></div>

    </div>

  </details>

</div>
