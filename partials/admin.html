<div class="admin-box">

  <div
    class="admin-panel"
    id="adminPanel"
  >

    <h2>
      Loot vergeben
    </h2>

    <div class="admin-grid">

      <div class="checkbox-group">

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Luna"
          >
          Luna
        </label>

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Milo"
          >
          Milo
        </label>

        <label>
          <input
            type="checkbox"
            name="lootChild"
            value="Finn"
          >
          Finn
        </label>

      </div>

      <input
        id="lootAmount"
        type="number"
        min="1"
        value="5"
      >

      <button
        class="plus"
        id="giveLootButton"
      >
        Loot vergeben
      </button>

      <div id="adminMessage"></div>

    </div>

    <h2>
      Belohnung erstellen
    </h2>

    <div class="admin-grid">

      <select id="rewardSelect">

        <option value="">
          Neue Belohnung
        </option>

      </select>

      <input
        id="rewardTitle"
        placeholder="Titel"
      >

      <input
        id="rewardTarget"
        type="number"
        min="1"
        placeholder="Zielpunkte"
      >

      <input
        id="rewardImg1"
        placeholder="Bild URL 1"
      >

      <input
        id="rewardImg2"
        placeholder="Bild URL 2"
      >

      <input
        id="rewardImg3"
        placeholder="Bild URL 3"
      >

      <select id="rewardVisibleFor">

        <option value="ALL">
          ALL
        </option>

        <option value="Luna">
          Luna
        </option>

        <option value="Milo">
          Milo
        </option>

        <option value="Finn">
          Finn
        </option>

      </select>

      <button
        class="save"
        id="saveRewardButton"
      >
        Belohnung speichern
      </button>

      <button
        class="minus"
        id="deactivateRewardButton"
      >
        Belohnung deaktivieren
      </button>

      <div
        id="rewardAdminInfo"
        class="info"
      ></div>

    </div>

  </div>

</div>
