<div
  id="childAdminOverlay"
  class="reward-overlay"
>

  <div class="admin-panel visible">

    <div class="top">

      <div
        id="childAdminTitle"
        class="name"
      >
        Kind verwalten
      </div>

      <button
        id="closeChildAdminButton"
        class="minus"
      >
        ✕
      </button>

    </div>

    <!-- LOOT -->

    <details
      class="admin-dropdown"
      open
    >

      <summary>
        Loot erstellen
      </summary>

      <div class="admin-grid">

        <input
          id="childLootAmount"
          type="number"
          placeholder="Loot Wert"
          value="5"
        >

        <button
          id="childLootButton"
          class="plus"
        >
          Loot erstellen
        </button>

      </div>

    </details>

    <!-- STREAK -->

    <details class="admin-dropdown">

      <summary>
        Streak erstellen
      </summary>

      <div class="admin-grid">

        <input
          id="streakTitle"
          placeholder="Titel"
        >

        <input
          id="streakEmoji"
          placeholder="Emoji"
        >

        <input
          id="streakGoal"
          type="number"
          placeholder="Ziel"
          value="10"
        >

        <input
          id="streakPoints"
          type="number"
          placeholder="Loot pro Klick"
          value="1"
        >

        <input
          id="streakBonus"
          type="number"
          placeholder="Bonus Loot"
          value="10"
        >

        <button
          id="saveStreakButton"
          class="save"
        >
          Streak speichern
        </button>

      </div>

    </details>

    <!-- LIST -->

    <details
      class="admin-dropdown"
      open
    >

      <summary>
        Streaks verwalten
      </summary>

      <div id="childStreakList"></div>

    </details>

  </div>

</div>
