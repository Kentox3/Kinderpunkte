<div id="childAdminOverlay" class="reward-overlay">

  <div class="admin-panel visible" style="max-width:430px;width:92%">

    <h2 id="childAdminTitle">
      Kind verwalten
    </h2>

    <div class="admin-grid">

      <h3>Loot vergeben</h3>

      <input
        id="childLootAmount"
        type="number"
        min="1"
        value="5"
        placeholder="Loot-Wert"
      >

      <button
        class="plus"
        id="childLootButton"
      >
        Loot hinzufügen
      </button>

      <h3>Streaks</h3>

      <div id="childStreakList"></div>

      <h3>Neue Streak</h3>

      <input
        id="streakTitle"
        placeholder="Titel, z.B. Wäsche machen"
      >

      <input
        id="streakEmoji"
        placeholder="Emoji, z.B. 🧦"
      >

      <input
        id="streakGoal"
        type="number"
        min="1"
        value="10"
        placeholder="Ziel"
      >

      <input
        id="streakPoints"
        type="number"
        min="0"
        value="1"
        placeholder="Punkte pro Klick"
      >

      <input
        id="streakBonus"
        type="number"
        min="0"
        value="10"
        placeholder="Bonus bei Abschluss"
      >

      <button
        class="save"
        id="saveStreakButton"
      >
        Streak speichern
      </button>

      <button
        class="minus"
        id="closeChildAdminButton"
      >
        Schließen
      </button>

    </div>

  </div>

</div>
